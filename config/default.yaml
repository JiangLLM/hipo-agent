# hippo-agent default config. All A/B switches live here; CLI flags override.

run:
  name: smoke
  seed: 0
  out_dir: runs
  concurrency: 8            # parallel tasks (and parallel trajectories within a task)
  budget_usd: 5.0          # hard stop per run

llm:
  model: openai/gpt-4o-mini
  embed_model: openai/text-embedding-3-small
  temperature: 0.7         # >0 so N trajectories diverge
  max_tokens: 1024
  cache: true              # cache by prompt hash to save money / be reproducible

agent:
  max_steps: 15
  n_traj: 5                # MaTTS-style: N trajectories per task

# --- the ablation matrix (what/when we store) ---
memory:
  mode: both               # off | fact_only | reasoning_only | both
  reasoning_write: append  # append-only for v1 (dedup/merge later)
  retrieve_k_reasoning: 1   # ReasoningBank ablation: SR peaks at k=1, degrades with more
                            # (marginal items dilute context / mislead); do not raise blindly
  retrieve_k_fact: 4
  relevance_threshold: 0.0  # cosine gate: only inject memory at least this relevant (0 = off)
  scope_reasoning: false    # restrict reasoning retrieval to task.scope (swe runs turn this on)
  token_budget: 4000       # cap on injected memory tokens (whole-item cap, not mid-cut)

# --- Mind2Web evaluation knobs (step_evolve = our two-layer step surprise) ---
m2w:
  protocol: step_evolve     # step_evolve (learn/test holdout) | stream (边学边升级: one pass, memory grows) | "" (task-level)
  parallelism: task         # task = concurrent tasks; step = concurrent N samples within each step
  layer1: on                # single-attempt per-step surprise: wrong OR correct-but-lucky
  layer2: on                # across-N contrast: majority-wrong->do-right / majority-correct->avoid
  record_mode: aggregate    # layer2 extraction: aggregate | all
  per_step_retrieval: on    # test-time retrieval granularity (on=per step, off=once per task)
  top_k: 5                  # candidate elements per step (MindAct/AWM ranker cut)
  holdout: 0.5

# --- SWE-bench-Verified knobs (task-level two-layer memory; see hippo/swe/run.py) ---
swe:
  dataset: princeton-nlp/SWE-bench_Verified
  split: test
  repos: django            # comma-separated repo substrings; "" = all repos
  limit: 0                 # 0 = no cap
  arch: arm64              # Epoch AI image arch (arm64 on Apple Silicon; 420/500 coverage)
  agent_model: openai/gpt-5-mini   # rollout model; judge/extract use llm.model
  step_limit: 60           # agent steps per attempt
  attempt_cost_limit: 0.5  # USD hard stop per attempt (mini-swe-agent cost guard)
  arms: nomem,withmem      # which passes to run, in order
  layer1: on               # per-attempt reflection on surprise (failed / unverified success)
  layer2: on               # cross-attempt contrast on divergence
  l1_max_per_task: 2       # anti-flooding: max L1 writes per task
  vote_margin: 2           # L2 only when |#success*2 - N| >= margin (3:2 splits skipped)
  judge_max_tokens: 8000   # reasoning models spend tokens thinking before the JSON
  # --- injection-side (read) knobs; arms=frozenmem + memory_in for fixed-bank ablations ---
  injection_gate: none     # none | llm (embedding top fetch_k -> LLM keeps only condition-matching items)
  retrieve_fetch_k: 10     # candidate pool size before the llm gate
  injection_style: plain   # plain | attend (force the agent to state which items it will use)

# --- WebArena knobs (task-level two-layer memory on autonomous web nav; hippo/wa/run.py) ---
wa:
  base_url: ""             # e.g. http://10.44.12.29 (self-hosted sites; required)
  base_urls: ""            # comma list of N WebArena deployments, one PER ROLLOUT. Required for
                           # MUTATING tasks: the N rollouts of a task share one account per site
                           # and the grader reads server state, so on a single deployment they
                           # cannot produce N independent rewards (the first success scores all of
                           # them). Leave empty for read-only tasks — nothing is written, so one
                           # deployment is correct and cheaper. Must list >= agent.n_traj boxes.
  reset_url: ""            # legacy WA_FULL_RESET endpoint. Never deployed, so reset_site used to
                           # be a no-op on every run while claiming otherwise. Superseded by
                           # fleet_reset below; kept only so old configs still parse.
  fleet_reset: off         # on = before each arm, restore all 8 boxes from their pristine images
                           # via scripts/wa_fleet.sh reset (a few minutes, runs in parallel).
                           # REQUIRED for any task set containing mutating tasks: without it the
                           # second arm starts on whatever the first arm wrote, and nothing
                           # downstream can detect that. The runner raises rather than run dirty.
  site: shopping           # shopping | shopping_admin | reddit | gitlab | map | wikipedia
  limit: 0                 # 0 = all single-site tasks for this site
  arms: nomem,withmem      # nomem | withmem | frozenmem
  memory_in: ""            # frozenmem/resume: path to a saved memory.json
  max_steps: 30            # agent turns per episode
  worker_recycle: 10       # ProcessPoolExecutor max_tasks_per_child: recycle a worker after this
                           # many rollouts so a wedged Playwright event loop ("no running event
                           # loop") is replaced by a fresh process instead of silently dropping
                           # 2 rollouts/task for the rest of the run.
  timeout: 10000           # per-action browser timeout (ms)
  step_timeout: 90         # hard wall-clock cap (s) on one env.step — kills wedged browser ops
  max_tokens: 8000         # shared budget: judge/extract need headroom (reasoning models
                           # burn tokens thinking); agent actions are short so this is free
  layer1: on
  layer2: on
  l1_fluke: on             # L1 records failures + 蒙对 flukes (reward=1 but judge: reasoning unsound); off = failures only
  inject_only_l2: on       # retrieval injects ONLY L2 lessons; L1 still written (for debug) but not retrieved
  inject_gate: llm         # none | llm — llm: cosine recall retrieve_fetch_k, then LLM picks the ONE applicable (or none)
  retrieve_fetch_k: 5      # candidate pool size for the llm inject gate
  vote_margin: 1           # (unused for WA L2 now: L2 fires on any nc<n, ratio-cased inside contrast_rollouts)
  divergence_signal: reward  # reward | judge — what counts a rollout success for L1/L2 gating
  readonly_only: false     # DEPRECATED alias for task_filter (true -> string_match). Kept so the
                           # commands that produced the 230-task runs still mean the same thing.
  task_filter: ""          # "" = defer to readonly_only, so every pre-existing command keeps its
                           # exact task set. New runs must name a filter explicitly — the
                           # denominator is never allowed to move silently.
                           # string_match (legacy 230: eval_types==["string_match"]) | readonly
                           # (434: frozen manifest says the task writes nothing) | all (812,
                           # mutating included — only sound with one deployment PER ROLLOUT)
  task_manifest: config/wa_task_class.json   # frozen statefulness classification; see
                           # scripts/classify_wa_tasks.py. Statefulness is not derivable from the
                           # eval field, so it is a checked-in artefact, not a run-time heuristic.
  shard: ""                # "i/n" round-robin task partition for PARALLEL readonly runs (K
                           # processes, each own browser, merge event logs after). Leave "" for
                           # streaming/withmem (memory accumulates in order — must not shard).
  eval_rollouts: 1         # rollouts per task for scoring-only arms (nomem/frozenmem). Set >1
                           # (e.g. 5) for a low-variance A/B: compare MEAN success rate (nc/n)
                           # per task instead of a single noisy rollout[0]. write arms use n_traj.
  seed: 0                  # bump for independent replicates (sampling-noise discipline)

surprise:
  source: traj_divergence  # traj_divergence | memory_pred | store_all
  # weights for the combined v1 score
  w_outcome_mix: 0.6       # success/failure disagreement across N trajectories
  w_mem_pred: 0.4          # memory-prediction error (predicted-solvable vs actual)
  threshold: 0.5           # write iff score >= threshold

replay:
  enabled: true
  schedule: batch          # batch ("sleep") | online (per task)
  batch_size: 8            # consolidate every N tasks
  priority: surprise       # prioritized replay key: surprise | fifo

judge:
  model: openai/gpt-4o-mini   # LLM-as-a-Judge (label-free, grounded on execution result)

logging:
  level: info
  jsonl: true              # structured event log for post-hoc analysis
  trace: false             # if true, log FULL thoughts + full injected memory per step
